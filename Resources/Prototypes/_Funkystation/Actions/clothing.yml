# flippable welding masks
- type: entity
  parent: BaseAction
  id: ActionToggleWeldingMask
  name: Toggle Welding Mask
  description: Flips the welding mask up or down.
  components:
  - type: Action
    itemIconStyle: BigItem
  - type: InstantAction
    event: !type:ToggleActionEvent

# hardsuit welding visors
- type: entity
  parent: BaseAction
  id: ActionToggleHelmetVisor
  name: Toggle Visor
  description: Flips the helmet visor up or down.
  components:
  - type: Action
    icon:
      sprite: Clothing/Head/Welding/welding.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleHelmetVisorEvent
