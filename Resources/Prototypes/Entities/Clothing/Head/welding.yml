- type: entity
  parent: [ ClothingHeadBase, BaseToggleClothing ] # Inferus - flippable welding masks, added BaseToggleClothing
  id: WeldingMaskBase
  name: welding mask
  abstract: true
  components:
  - type: Item
    storedRotation: 0
  # BEGIN Inferus - flippable welding masks, moved into the ComponentToggler below so they only apply while the mask is down
  # - type: IngestionBlocker
  # - type: FlashImmunity
  # - type: IdentityBlocker
  # - type: EyeProtection
  # END Inferus
  - type: PhysicalComposition
    materialComposition:
      Steel: 200
      Glass: 100
  - type: StaticPrice
    price: 50
  - type: Tag
    tags:
    - WhitelistChameleon
    - WeldingMask
  - type: HideLayerClothing
    slots:
    - Snout
  # BEGIN Inferus - flippable welding masks
  - type: ToggleClothing
    action: ActionToggleWeldingMask
    mustEquip: false
  - type: ItemToggle
    activated: true
  - type: ComponentToggler
    components:
    - type: IngestionBlocker
    - type: FlashImmunity
    - type: IdentityBlocker
    - type: EyeProtection
    - type: ESViewconeModifier # viewcone port, only while the mask is down!!
      angleModifier: -160
  - type: ItemTogglePrefix
    prefixOn: null
    prefixOff: up
  - type: ToggleClothingPrefix
    prefixOn: null
    prefixOff: up
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: icon}
          False: {state: icon-up}
  # END Inferus

- type: entity
  parent: WeldingMaskBase
  id: ClothingHeadHatWelding
  name: welding mask
  description: A head-mounted face cover designed to protect the wearer completely from space-arc eye.
  components:
  - type: Sprite
    sprite: Clothing/Head/Welding/welding.rsi
    layers: # Inferus - flippable welding masks
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: Clothing/Head/Welding/welding.rsi
  - type: Tag
    tags:
    - HamsterWearable
    - WhitelistChameleon
    - WeldingMask

